<!DOCTYPE html><html lang="pt-BR"><head><meta name="google-site-verification" content="xS4mm8NIrgLz1FuP_9OGvS2Thh8CUL5cr2GS2i0v7CU" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#172B43"><script src="config.js"></script><title>OrganizaSaldo — Controle Financeiro Pessoal</title><meta name="color-scheme" content="light dark">
<style>
:root{--nv:#172B43;--n2:#304B67;--cr:#F8F5ED;--go:#C5A46C;--bg:#F8F5ED;--cd:#fff;--tx:#172B43;--mu:#6B7686;--bd:#E4DCC8;--gr:#2F7D5B;--grl:#E3F0E8;--rd:#B5473F;--rdl:#F7E2DF;--yl:#8A6D1F;--yll:#FBF1CF;--pu:#6B4FA0;--pul:#E9E2F6;--bl:#2E5E8C;--bll:#DCE9F5;font-family:Calibri,"Segoe UI",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#101c2b;--cd:#1a2b40;--tx:#F1ECDF;--mu:#a9b4c2;--bd:#2c4059}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--nv),#0f1f33);color:#F8F5ED;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside h1{font:700 20px Georgia,serif;text-align:center;margin:0 0 2px;line-height:1.15}aside .hi{text-align:center;color:var(--go);font-weight:700;margin:0 0 14px}
nav button{width:100%;text-align:left;background:none;border:0;color:#F8F5ED;font:600 15px inherit;padding:11px 12px;border-radius:10px;cursor:pointer}nav button.on{background:var(--go);color:var(--nv)}
.meta{margin-top:auto;font-size:13px;text-align:center}.bar{height:9px;background:#fff3;border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:#3aa56f}
.foot{font-size:10px;color:#b9c3d0;text-align:center;line-height:1.4}
main{padding:0 0 30px;min-width:0}header{background:var(--nv);color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}header h2{margin:0;font:700 26px Georgia,serif}
select,input,button{font:inherit;color:inherit}select,input{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}header select{width:auto;color:var(--nv);background:#fff}
.sec{padding:16px 22px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;border-top:3px solid var(--go)}.k small{color:var(--mu);font-weight:700;font-size:11px;text-transform:uppercase}.k b{display:block;font-size:21px;margin-top:2px}
.g{color:var(--gr)}.r{color:var(--rd)}.y{color:var(--yl)}.b{color:var(--bl)}
.gr3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}.pn{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;overflow:hidden}.pn h3{margin:0 0 8px;font:700 16px Georgia,serif}
.btn{background:linear-gradient(#d9bd88,var(--go));color:var(--nv);font-weight:800;border:0;border-radius:10px;padding:11px 16px;min-height:44px;cursor:pointer}.btn.s{background:var(--nv);color:#fff}.btn:disabled{opacity:.5}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}label{font-size:12px;font-weight:700;display:block}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th{background:var(--nv);color:#fff;padding:9px 8px;text-align:left;white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.st{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:700;font-size:12px}.Paga,.Quitada,.Pago,.Recebido,.Recebida{background:var(--grl);color:var(--gr)}.Pendente,.Areceber{background:var(--yll);color:var(--yl)}.Atrasada{background:var(--rdl);color:var(--rd)}.Futura{background:var(--bll);color:var(--bl)}.Parcial{background:var(--pul);color:var(--pu)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:14px}.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.mo div{background:var(--cd);padding:20px;border-radius:14px;max-width:420px;width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:12px 18px;border-radius:10px;z-index:10;display:none}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}aside h1{font-size:15px;flex:1}aside .hi{margin:0}nav{display:flex;gap:4px;width:100%;overflow-x:auto}nav button{text-align:center;padding:10px;white-space:nowrap}.meta,.foot.d{display:none}.cols{grid-template-columns:1fr}.sec{padding:12px}header{padding:12px}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const K="meudinheiro.v1",VER="1.0 (nov/2026)",$=s=>document.querySelector(s);
const M=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());const dm=s=>s?s.split("-").reverse().join("/"):"—";
const addM=(s,n)=>{const[y,m,d]=s.split("-").map(Number),t=new Date(y,m-1+n,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return iso(new Date(t.getFullYear(),t.getMonth(),Math.min(d,l)))};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const def=()=>({name:"",goal:50000,seq:0,cats:{E:["Salário","Renda extra","Vendas","Outros recebimentos"],S:["Moradia","Alimentação","Supermercado","Transporte","Saúde","Educação","Lazer","Compras pessoais","Assinaturas","Impostos","Outros"]},lan:[],par:[]});
let db;try{db=JSON.parse(localStorage.getItem(K))||def()}catch(e){db=def()}
const save=()=>{try{db.rev=(db.rev||0)+1;localStorage.setItem(K,JSON.stringify(db))}catch(e){toast("Não foi possível salvar neste aparelho (armazenamento cheio ou bloqueado). Faça um backup agora para não perder dados.")}if(typeof schedSync==='function')schedSync()};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",3500)}
let view="painel",mes=new Date().getMonth(),ano=new Date().getFullYear(),filt={sit:"Todas",q:"",tp:"Todos",m:-1},busy=0,pre=null;
const paid=p=>p.pays.reduce((a,x)=>a+x.v,0),saldo=p=>p.val-paid(p),lan=id=>db.lan.find(l=>l.id===id);
function sit(p){const s=saldo(p);if(s<=0)return"Quitada";const t=today();if(p.venc<t)return"Atrasada";if(paid(p)>0)return"Parcial";const e=addM(t.slice(0,8)+"01",1);return p.venc<e?"Pendente":"Futura"}
const lbl=p=>p.dir==="E"?(sit(p)==="Quitada"?"Recebida":sit(p)==="Pendente"||sit(p)==="Futura"?"A receber":sit(p)):sit(p);
function addLan(f){const id="L"+String(++db.seq).padStart(3,"0"),c=Math.round(f.val*100),l={id,date:f.date,tipo:f.tipo,cat:f.cat,desc:f.desc,forma:f.forma,val:c,tpg:f.tpg,qtd:f.qtd,fv:f.fv,sit:f.sit,obs:f.obs};db.lan.push(l);
 const mk=(n,tot,first)=>{const b=Math.round(tot/n);for(let j=1;j<=n;j++)db.par.push({id:id+"-"+String(j).padStart(2,"0"),lid:id,n:j,of:n,venc:addM(first,j-1),val:j===n?tot-b*(n-1):b,dir:f.tipo==="Entrada"?"E":"S",parc:n>1,pays:[]})};
 if(f.tipo==="Saída"&&f.tpg==="Parcelado")mk(f.qtd,c,f.fv);else if(f.sit==="Pendente")mk(1,c,f.fv||f.date);}
const inM=(s,m,y)=>{const[a,b]=s.split("-").map(Number);return a===y&&b===m+1};
function calc(m,y){const r={ent:0,desp:0,prev:0,pagas:0,pend:0,ant:0,atr:0,rec:0,sp:0},ini=y+"-"+String(m+1).padStart(2,"0")+"-01",t=today();
 lan$().forEach(l=>{if(l.sit!=="Pendente"&&!(l.tipo==="Saída"&&l.tpg==="Parcelado")&&inM(l.date,m,y))l.tipo==="Entrada"?r.ent+=l.val:r.desp+=l.val});
 par$().forEach(p=>{p.pays.forEach(x=>{if(inM(x.d,m,y))p.dir==="E"?r.ent+=x.v:r.desp+=x.v});const s=saldo(p);
  if(p.dir==="E"){if(inM(p.venc,m,y))r.rec+=s;return}
  if(p.parc)r.sp+=s;if(inM(p.venc,m,y)){r.prev+=p.val;r.pagas+=paid(p);r.pend+=s}if(p.venc<ini)r.ant+=s;if(p.venc<t)r.atr+=s});
 r.saldo=r.ent-r.desp;r.pct=r.ent>0?r.saldo/r.ent*100:null;r.treg=r.pend+r.ant;return r}
function cats(m,y){const o={};lan$().forEach(l=>{if(l.tipo==="Saída"&&l.sit!=="Pendente"&&l.tpg!=="Parcelado"&&inM(l.date,m,y))o[l.cat]=(o[l.cat]||0)+l.val});
 par$().forEach(p=>{if(p.dir==="S"){const c=lan(p.lid)?.cat;p.pays.forEach(x=>{if(inM(x.d,m,y))o[c]=(o[c]||0)+x.v})}});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const sv=(h,w=300,hh=170)=>`<svg viewBox="0 0 ${w} ${hh}" width="100%" role="img">${h}</svg>`;
function bars(d,cols,w=300,h=170){const mx=Math.max(1,...d.map(x=>x[1]))*1.15,bw=Math.min(46,(w-30)/d.length-10);return sv(d.map((x,i)=>{const bh=(h-50)*x[1]/mx,cx=20+(i+.5)*(w-30)/d.length;return`<rect x="${cx-bw/2}" y="${h-28-bh}" width="${bw}" height="${bh}" rx="4" fill="${cols[i%cols.length]}"/><text x="${cx}" y="${h-32-bh}" font-size="9.5" font-weight="700" text-anchor="middle" fill="currentColor">${brl(x[1]).replace("R$ ","")}</text><text x="${cx}" y="${h-12}" font-size="10" text-anchor="middle" fill="currentColor">${x[0]}</text>`}).join(""),w,h)}
function donut(d){const tot=d.reduce((a,x)=>a+x[1],0),C=["#172B43","#C5A46C","#2F7D5B","#6A7DB8","#D87E9B","#9AA0A6"];if(!tot)return`<p style="color:var(--mu)">Sem despesas pagas no período.</p>`;let a=-Math.PI/2,s="";
 const top=d.slice(0,5),rest=d.slice(5).reduce((x,y)=>x+y[1],0);if(rest)top.push(["Outros",rest]);
 top.forEach((x,i)=>{const f=x[1]/tot,b=a+f*2*Math.PI,L=f>.5?1:0,p=(r,t)=>[60+r*Math.cos(t),60+r*Math.sin(t)];const[x1,y1]=p(50,a),[x2,y2]=p(50,b),[x3,y3]=p(30,b),[x4,y4]=p(30,a);s+=`<path d="M${x1} ${y1}A50 50 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A30 30 0 ${L} 0 ${x4} ${y4}Z" fill="${C[i]}"/>`;a=b});
 return`<div style="display:flex;gap:10px;align-items:center"><svg viewBox="0 0 120 120" width="42%">${s}<text x="60" y="58" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor">${brl(tot)}</text><text x="60" y="68" font-size="7" text-anchor="middle" fill="currentColor">Total</text></svg><div style="font-size:12.5px;flex:1">${top.map((x,i)=>`<div class="row"><span><i style="display:inline-block;width:9px;height:9px;border-radius:9px;background:${C[i]}"></i> ${esc(x[0])}</span><b>${Math.round(x[1]/tot*100)}%</b></div>`).join("")}</div></div>`}
function line(a,b,lab){const w=300,h=170,mx=Math.max(1,...a,...b)*1.1,P=(v,i)=>`${25+i*(w-40)/5},${h-28-(h-50)*v/mx}`;
 return sv(`<polyline fill="none" stroke="#2F7D5B" stroke-width="2.5" points="${a.map((v,i)=>P(v,i)).join(" ")}"/><polyline fill="none" stroke="#B5473F" stroke-width="2.5" points="${b.map((v,i)=>P(v,i)).join(" ")}"/>`+lab.map((t,i)=>`<text x="${25+i*(w-40)/5}" y="${h-10}" font-size="10" text-anchor="middle" fill="currentColor">${t}</text>`).join("")+`<text x="30" y="12" font-size="10" fill="#2F7D5B">● Entradas</text><text x="100" y="12" font-size="10" fill="#B5473F">● Saídas</text>`,w,h)}
const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>`<option ${x[0]==v?"selected":""} value="${esc(x[0])}">${esc(x[1])}</option>`).join("")}</select>`;
const mY=()=>`<label style="color:#fff;display:flex;align-items:center;gap:6px">Mês ${sel("sm",M.map((m,i)=>[i,m]),mes)} Ano ${sel("sa",[0,1,2,3,4,5,6].map(i=>[new Date().getFullYear()-2+i,new Date().getFullYear()-2+i]),ano)}</label>`;
function shell(t,sub,h){const m=(db.goal?Math.max(0,calc(mes,ano).saldo)/db.goal:0);return`<aside><h1>OrganizaSaldo<br><small style="font:600 11px Calibri">Controle Financeiro Pessoal</small></h1><div class="hi">Olá, ${esc(db.name)}!</div><nav>${[["painel","Painel"],["lan","Lançamentos"],["cap","Contas a Pagar"],["cfg","Configurações"]].map(x=>`<button class="${view===x[0]?"on":""}" data-v="${x[0]}">${x[1]}</button>`).join("")}</nav><div class="meta">Meta do Mês<br><b style="font-size:18px">${brl(db.goal)}</b><div class="bar"><i style="width:${Math.min(100,m*100)}%"></i></div>${Math.round(m*100)}% da meta<br><small>(${brl(Math.max(0,calc(mes,ano).saldo))} de saldo realizado)</small><br><small style="color:#b9c3d0">Calculado pelo saldo realizado; não significa dinheiro reservado.</small></div><div class="foot d" style="margin-top:12px">Desenvolvido por Priscila Vieira<br>© 2026 Priscila Vieira. Todos os direitos reservados.<br>Versão ${VER}<br>Licença de uso pessoal; proibida a revenda e a redistribuição.</div></aside><main><header><h2>${t}</h2>${h||""}</header>`}
function painel(){const r=calc(mes,ano),k=(a,b,c="")=>`<div class="k"><small>${a}</small><b class="${c}">${b}</b></div>`;
 const six=[...Array(6)].map((_,i)=>{const d=new Date(ano,mes-5+i,1);return[d.getMonth(),d.getFullYear()]}).map(([m,y])=>calc(m,y)),lab=[...Array(6)].map((_,i)=>M[new Date(ano,mes-5+i,1).getMonth()].slice(0,3));
 const nx=[...Array(6)].map((_,i)=>{const d=new Date(ano,mes+i,1),ini=iso(d),fim=iso(new Date(d.getFullYear(),d.getMonth()+1,1));return[M[d.getMonth()].slice(0,3),par$().filter(p=>p.dir==="S"&&(i?p.venc>=ini:true)&&p.venc<fim).reduce((a,p)=>a+saldo(p),0)]});
 const pv=par$().filter(p=>p.dir==="S"&&saldo(p)>0).sort((a,b)=>a.venc<b.venc?-1:1).slice(0,5);
 return shell("Painel Financeiro","",mY())+`<div class="sec"><div class="kp">${k("Entradas recebidas",brl(r.ent),"g")}${k("Despesas pagas",brl(r.desp),"r")}${k("Resultado do mês",brl(r.saldo),r.saldo<0?"r":"g")}${k("Saldo disponível",brl(cashAt(mes,ano)),cashAt(mes,ano)<0?"r":"g")}${k("Patrimônio investido",brl(invAt(mes,ano)),"b")}${k("Economizado",r.pct===null?"— sem receitas":r.pct.toFixed(2).replace(".",",")+"%")}${k("Contas previstas",brl(r.prev),"b")}${k("Pendências anteriores",brl(r.ant),"r")}${k("Contas atrasadas (hoje)",brl(r.atr),"r")}${k("Total a regularizar",brl(r.treg))}${k("Receitas a receber",brl(r.rec),"b")}${k("Saldo parcelado",brl(r.sp),"b")}</div>
 <div class="gr3"><div class="pn"><h3>Entradas × Saídas</h3>${bars([["Entradas",r.ent],["Despesas",r.desp]],["#2F7D5B","#B5473F"])}</div><div class="pn"><h3>Despesas por Categoria</h3>${donut(cats(mes,ano))}</div><div class="pn"><h3>Evolução (6 meses)</h3>${line(six.map(x=>x.ent),six.map(x=>x.desp),lab)}</div>
 <div class="pn"><h3>Contas do Mês</h3><div class="row"><span>Pagas</span><b>${brl(r.pagas)}</b></div><div class="row"><span>Pendentes (no mês)</span><b>${brl(r.pend)}</b></div><div class="row"><span>Pendências anteriores</span><b class="r">${brl(r.ant)}</b></div><div class="row"><b>Total a regularizar</b><b>${brl(r.treg)}</b></div></div>
 <div class="pn"><h3>Compromissos dos Próximos Meses</h3>${bars(nx,["#C5A46C"])}</div><div class="pn"><h3>Próximos Vencimentos</h3>${pv.map(p=>`<div class="row"><span>${dm(p.venc).slice(0,5)} · ${esc(lan(p.lid)?.desc)} ${p.of>1?p.n+"/"+p.of:""}</span><b>${brl(saldo(p))}</b></div>`).join("")||"<p style=color:var(--mu)>Nenhuma conta em aberto.</p>"}</div></div>
 <p style="margin-top:12px"><button class="btn" data-v="lan">+ Novo Lançamento</button> <button class="btn s" data-v="cap">Registrar Pagamento</button></p></div></main>`}
function lanV(){const L=db.lan.filter(l=>(filt.tp==="Todos"||(filt.tp==="Entradas"?l.tipo==="Entrada":filt.tp==="Saídas"?l.tipo==="Saída":filt.tp==="Parcelados"?l.tpg==="Parcelado":l.sit==="Pendente"))&&l.desc.toLowerCase().includes(filt.q.toLowerCase())).slice().reverse();
 const st=l=>{if(l.canc)return"Cancelado";const ps=db.par.filter(p=>p.lid===l.id);if(!ps.length)return l.tipo==="Entrada"?"Recebido":"Pago";const s=ps.map(sit);return s.every(x=>x==="Quitada")?"Quitada":s.includes("Atrasada")?"Atrasada":ps.some(p=>paid(p)>0)?"Parcial":s.includes("Pendente")?"Pendente":"Futura"};
 return shell("Lançamentos","")+`<div class="sec"><div class="pn"><h3>Novo Lançamento</h3><form id="fl" class="fm"><div><label>Data *</label><input type="date" name="date" value="${today()}" required></div><div><label>Tipo *</label><select name="tipo"><option>Saída</option><option>Entrada</option></select></div><div><label>Categoria *</label><select name="cat" id="fc"></select></div><div><label>Descrição *</label><input name="desc" maxlength="60" required></div><div><label>Forma de pagamento *</label><select name="forma">${["Pix","Dinheiro","Débito","Crédito","Boleto","Transferência","Débito automático","Outros"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Valor total (R$) *</label><input name="val" inputmode="decimal" placeholder="1200,00" required></div><div><label>Tipo de pagamento *</label><select name="tpg"><option>À vista</option><option>Parcelado</option></select></div><div><label>Qtde. de parcelas</label><input name="qtd" type="number" min="2" max="60" value="6"></div><div><label>Primeiro vencimento</label><input type="date" name="fv"></div><div><label>Situação *</label><select name="sit"><option>Pago</option><option>Pendente</option></select></div><div><label>Observações</label><input name="obs" maxlength="80"></div><button class="btn" id="add">+ ADICIONAR LANÇAMENTO</button></form></div>
 <div class="pn" style="margin-top:12px"><h3>Lançamentos Registrados</h3><div class="fm" style="margin-bottom:8px"><select id="ft">${["Todos","Entradas","Saídas","Parcelados","Pendentes"].map(x=>`<option ${x===filt.tp?"selected":""}>${x}</option>`).join("")}</select><input id="fq" placeholder="Buscar descrição…" value="${esc(filt.q)}"></div><div class="tw"><table><tr><th>ID</th><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Pagamento</th><th>Valor total</th><th>Parc.</th><th>1º venc.</th><th>Situação</th></tr>${L.map(l=>`<tr><td>${l.id}</td><td>${dm(l.date)}</td><td class="${l.tipo==="Entrada"?"g":"r"}"><b>${l.tipo==="Entrada"?"↑":"↓"} ${l.tipo}</b></td><td>${esc(l.cat)}</td><td>${esc(l.desc)}</td><td>${l.tpg}</td><td><b>${brl(l.val)}</b></td><td>${l.tpg==="Parcelado"?l.qtd+"x":"—"}</td><td>${dm(l.fv)}</td><td><span class="st ${st(l)==="A receber"?"Areceber":st(l)}">${st(l)}</span></td></tr>`).join("")||"<tr><td colspan=10>Nenhum lançamento.</td></tr>"}</table></div></div></div></main>`}
